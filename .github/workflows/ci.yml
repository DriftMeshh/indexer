name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not "lts/*": better-sqlite3@11.10.0 only ships a prebuilt
      # binary up to Node 22's ABI, so a newer "latest LTS" forces a
      # from-source node-gyp build that fails against that Node version's
      # V8 headers (PropertyCallbackInfo lost its .This() method). Hit
      # this for real when GitHub's runner moved lts/* to Node 26.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm install

      - name: Build bindings/*
        run: npm run build --workspaces --if-present

      - run: npm test

      - run: npm run typecheck

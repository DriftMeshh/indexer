name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - run: npm install

      - name: Build bindings/*
        run: npm run build --workspaces --if-present

      - run: npm test

      - run: npm run typecheck
